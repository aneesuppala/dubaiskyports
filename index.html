<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dubai Skyports | UAE Transit Intelligence</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #040814;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.12) 0%, transparent 55%),
        radial-gradient(circle at 50% 40%, rgba(99, 102, 241, 0.08) 0%, transparent 60%);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 2.5rem 1.5rem 1.5rem;
      text-align: center;
    }
    .top-bar {
      width: 100%;
      max-width: 980px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 3.5rem;
    }
    .brand {
      color: #f8fafc;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .brand-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 12px #38bdf8;
    }
    .status-badge {
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      font-size: 0.75rem;
      color: #38bdf8;
      font-weight: 600;
    }
    .hero-container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 0.4rem 1.1rem;
      border-radius: 999px;
      font-size: 0.8rem;
      color: #94a3b8;
      font-weight: 600;
      margin-bottom: 1.5rem;
    }
    .hero-badge .pulse {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 8px #38bdf8;
    }
    h1 {
      font-size: clamp(2.4rem, 6vw, 4.2rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1.1;
      margin-bottom: 1.25rem;
    }
    h1 .glow {
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      color: #94a3b8;
      font-size: clamp(1rem, 2.5vw, 1.2rem);
      line-height: 1.6;
      max-width: 680px;
      margin: 0 auto 3rem;
      font-weight: 400;
    }
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.25rem;
      width: 100%;
      max-width: 940px;
      margin: 0 auto 2.5rem;
    }
    @media (max-width: 768px) {
      .cards-grid {
        grid-template-columns: 1fr;
        gap: 0.85rem;
      }
    }
    .card {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.04) 0%, rgba(255, 255, 255, 0.015) 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 1.75rem 1.25rem;
      position: relative;
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      backdrop-filter: blur(12px);
      text-align: left;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(56, 189, 248, 0.3);
      box-shadow: 0 16px 32px -8px rgba(0, 0, 0, 0.6), 0 0 24px -4px rgba(56, 189, 248, 0.12);
    }
    .card-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.25rem;
      color: #38bdf8;
    }
    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.35;
      margin-bottom: 0.5rem;
      letter-spacing: -0.01em;
    }
    .card-desc {
      font-size: 0.85rem;
      color: #94a3b8;
      line-height: 1.5;
    }
    .banner-proof {
      margin: 0 auto 2.5rem;
      max-width: 520px;
      padding: 0.9rem 1.5rem;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.18);
    }
    .banner-proof p {
      color: #38bdf8;
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: 0.05em;
      margin: 0;
    }
    .form-wrap {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
    }
    .form-box {
      display: flex;
      gap: 0.5rem;
      background: rgba(17, 24, 39, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 0.4rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .form-box input {
      flex: 1;
      background: transparent;
      border: none;
      padding: 0.85rem 1rem;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
    }
    .form-box input::placeholder {
      color: #475569;
    }
    .form-box button {
      background: #38bdf8;
      color: #040814;
      border: none;
      padding: 0.85rem 1.6rem;
      border-radius: 10px;
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
      letter-spacing: 0.01em;
      transition: all 0.2s ease;
      white-space: nowrap;
    }
    .form-box button:hover {
      background: #7dd3fc;
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.4);
    }
    .privacy-notice {
      color: #64748b;
      font-size: 0.75rem;
      margin-top: 0.85rem;
    }
    footer {
      width: 100%;
      max-width: 900px;
      margin-top: 4rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.8rem;
      color: #94a3b8;
      line-height: 1.6;
    }
    .disclaimer {
      color: #64748b;
      font-size: 0.75rem;
      margin-top: 0.35rem;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="brand">
      <span class="brand-dot"></span>
      <span>Dubai Skyports</span>
    </div>
    <div class="status-badge">Live Commute Index</div>
  </div>

  <main class="hero-container">
    <div class="hero-badge">
      <span class="pulse"></span> UAE Multimodal Transit Intelligence
    </div>

    <h1>The Future of UAE Commute <span class="glow">Is Arriving.</span></h1>

    <p class="subtitle">
      Tracking vertiports, RTA bus metro and intercity corridors informations, and the national Etihad Rail passenger network.
    </p>
